name: Backend CI/CD

on:
  workflow_call:

jobs:
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm build:backend

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
      - name: Setup MySQL 8
        uses: mirromutth/mysql-action@v1.1
        with:
          mysql version: "8.0"
          mysql database: "game_deal_test"
          mysql root password: "root"
      - name: Setup Redis 8
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 8
      - run: pnpm install
      - run: pnpm test:backend:cov
        env:
          test: true
      - name: coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend_coverage
          path: apps/backend/coverage/
          if-no-files-found: error

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm lint:backend

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      deployments: write
    steps:
      - uses: JorgeLNJunior/render-deploy@v1.4.6
        with:
          service_id: ${{ secrets.BACKEND_RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true
          github_deployment: true
          deployment_environment: "backend"
          github_token: ${{ secrets.GITHUB_TOKEN }}
