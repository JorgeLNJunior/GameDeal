name: Frontend CI/CD

on:
  workflow_call:

jobs:
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm build:frontend
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: apps/frontend/dist
          if-no-files-found: error

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm test:frontend:cov
        env:
          test: true
      - name: coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend_coverage
          path: apps/frontend/coverage/
          if-no-files-found: error

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm lint:frontend

  docker:
    name: 🐳 Build and Publish Docker Container
    runs-on: ubuntu-latest
    needs: [build, test, lint]
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: "./apps/frontend/Dockerfile"
          push: true
          tags: |
              jorgelnjunior/gamedealfrontend:latest
              jorgelnjunior/gamedealfrontend:${{ github.sha }}
              ghcr.io/jorgelnjunior/gamedealfrontend:latest
              ghcr.io/jorgelnjunior/gamedealfrontend:${{ github.sha }}

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      deployments: write
    steps:
      - uses: JorgeLNJunior/render-deploy@v1.4.6
        with:
          service_id: ${{ secrets.FRONTEND_RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true
          github_deployment: true
          deployment_environment: "frontend"
          github_token: ${{ secrets.GITHUB_TOKEN }}
