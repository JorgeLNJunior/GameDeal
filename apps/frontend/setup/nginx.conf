worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include mime.types;
  default_type  application/octet-stream;
  proxy_pass_header Server;
  server_tokens off;

  server {
    listen 3000;
    listen [::]:3000;

    root /usr/app/gamedeal/apps/frontend/dist;
    index index.html;

    location / {
      try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(?:css|js|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /assets { }
  }
}
